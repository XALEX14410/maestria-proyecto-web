spring.application.name=backend-app
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties],optional:file:./backend-app/.env[.properties]
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.demo-user.enabled=${APP_DEMO_USER_ENABLED:false}
app.demo-user.name=${APP_DEMO_USER_NAME:Usuario Demo}
app.demo-user.email=${APP_DEMO_USER_EMAIL:}
app.demo-user.password=${APP_DEMO_USER_PASSWORD:}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${GROQ_API_KEY:taskhive-local-groq-placeholder}

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
