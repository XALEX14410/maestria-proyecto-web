spring.application.name=backend-app
spring.config.import=optional:file:.env[.properties], optional:file:./backend-app/.env[.properties]
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.demo-user.enabled=${APP_DEMO_USER_ENABLED:false}
app.demo-user.name=${APP_DEMO_USER_NAME:Usuario Demo}
app.demo-user.email=${APP_DEMO_USER_EMAIL:}
app.demo-user.password=${APP_DEMO_USER_PASSWORD:}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

